<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Voice assistant Fateh: speech recognition feeding a priority-ordered intent router">
  <defs><style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .h{font-size:13px;font-weight:800;letter-spacing:3px}
    .d{font:500 11.5px Consolas,'Courier New',monospace;fill:#8a9bae}
    .r{font:600 12.5px Consolas,'Courier New',monospace;fill:#c8d1e6}
    .a{font:500 12px Consolas,'Courier New',monospace;fill:#5a6e7a}
    .q{font:600 15px Consolas,'Courier New',monospace;fill:#e8f5ee}
    .flow{stroke:#2ecc71;stroke-width:2.2;fill:none;stroke-dasharray:8 6;animation:flow .9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .bar{animation:eq .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  </style></defs>
  <rect width="1200" height="552" rx="18" fill="#0a0c12"/>
  <text x="40" y="44" class="h" fill="#2ecc71">VOICE ASSISTANT “FATEH” · INTENT ROUTER</text>
  <text x="40" y="64" class="d">render2.js · recognition.onresult → takeCommand(transcript) — first match wins, top to bottom</text>
  <g transform="translate(170 150)">
    <circle r="30" fill="#2ecc71" fill-opacity=".12" stroke="#2ecc71" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#2ecc71"><animate attributeName="r" values="30;60" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="30" fill="none" stroke="#2ecc71"><animate attributeName="r" values="30;60" dur="1.8s" begin=".9s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" begin=".9s" repeatCount="indefinite"/></circle>
    <text y="9" text-anchor="middle" style="font-size:26px">🎙️</text>
  </g>
  <text x="170" y="210" text-anchor="middle" class="d">operator speaks</text>

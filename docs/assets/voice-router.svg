  <text x="170" y="292" text-anchor="middle" class="d">continuous · lang en-IN</text>
  <text x="170" y="308" text-anchor="middle" class="d">auto-restart after 1 s</text>
  <path d="M170 320 V346" class="flow"/>
  <rect x="40" y="350" width="260" height="56" rx="28" fill="#2ecc71" fill-opacity=".08" stroke="#2ecc71"/>
  <text x="170" y="383" text-anchor="middle" class="q" opacity="0">“hello fateh”<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0001;0.2499;0.2500;1" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="170" y="383" text-anchor="middle" class="q" opacity="0">“weather in dehradun”<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.2500;0.4999;0.5000;1" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="170" y="383" text-anchor="middle" class="q" opacity="0">“route to rishikesh”<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.5000;0.7499;0.7500;1" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="170" y="383" text-anchor="middle" class="q" opacity="0">“search equipment rope”<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.7500;0.9999;1.0000;1" calcMode="discrete" dur="16.0s" repeatCount="indefinite"/></text>
  <text x="170" y="430" text-anchor="middle" class="d">.toLowerCase() → history log</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="NDRF Base Station — AI-powered disaster response command center">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset=".55" stop-color="#0f111a"/>
      <stop offset="1" stop-color="#1a1c2e"/>
    </linearGradient>
    <radialGradient id="sweep" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="130">
      <stop offset="0" stop-color="#2ecc71" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0"/>
      <stop offset="1" stop-color="#2ecc71" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2ecc71" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <clipPath id="t1"><rect x="430" y="214" height="34" width="0"><animate attributeName="width" values="0;483;483;0;0" keyTimes="0;.1;.2;.24;1" dur="14s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="430" y="214" height="34" width="0"><animate attributeName="width" values="0;472;472;0;0" keyTimes="0;.1;.2;.24;1" dur="14s" begin="3.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="430" y="214" height="34" width="0"><animate attributeName="width" values="0;368;368;0;0" keyTimes="0;.1;.2;.24;1" dur="14s" begin="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="430" y="214" height="34" width="0"><animate attributeName="width" values="0;494;494;0;0" keyTimes="0;.1;.2;.24;1" dur="14s" begin="10.5s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .title{font:800 54px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:6px;fill:#e8f5ee}
      .sub{font:600 17px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:5px;fill:#2ecc71}
      .mono{font:500 20px Consolas,'Courier New',monospace;fill:#c8d1e6}
      .chip{font:700 12px Consolas,'Courier New',monospace;letter-spacing:2px;fill:#8a9bae}
      .glow{animation:glow 3s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:1}50%{opacity:.72}}
      .dot{animation:pulse 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .d2{animation-delay:.35s}.d3{animation-delay:.7s}.d4{animation-delay:1.05s}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.5)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- scan line -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;360" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- radar -->
    <g transform="translate(205 180)">
      <circle r="130" fill="#0a0c12" fill-opacity=".6" stroke="#2ecc71" stroke-opacity=".5" stroke-width="1.5"/>
      <circle r="95" fill="none" stroke="#2ecc71" stroke-opacity=".3"/>
      <circle r="60" fill="none" stroke="#2ecc71" stroke-opacity=".3"/>
      <circle r="25" fill="none" stroke="#2ecc71" stroke-opacity=".3"/>
      <path d="M-130 0H130M0-130V130" stroke="#2ecc71" stroke-opacity=".2"/>
      <g>
        <path d="M0 0L130 0A130 130 0 0 0 91.9 -91.9Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="130" y2="0" stroke="#2ecc71" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
      <!-- survivor blips -->
      <g fill="#2ecc71">
        <circle cx="48" cy="-62" r="5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="-70" cy="-30" r="5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.9s" repeatCount="indefinite"/></circle>
        <circle cx="-30" cy="80" r="5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.8s" repeatCount="indefinite"/></circle>
      </g>
      <circle cx="78" cy="40" r="6" fill="#dc2626"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.6s" repeatCount="indefinite"/></circle>
      <circle r="5" fill="#2ecc71"/>
      <circle r="5" fill="none" stroke="#2ecc71">
        <animate attributeName="r" values="5;130" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- drone -->
    <g class="bob">
      <g transform="translate(1110 262)" fill="none" stroke="#2ecc71" stroke-width="2">
        <rect x="-18" y="-7" width="36" height="14" rx="4" fill="#2ecc71" fill-opacity=".85" stroke="none"/>
        <path d="M-18 0H-44M18 0H44"/>
        <g transform="translate(-44 -4)"><ellipse rx="18" ry="3.5"><animateTransform attributeName="transform" type="scale" values="1 1;0.15 1;1 1" dur="0.18s" repeatCount="indefinite"/></ellipse></g>
        <g transform="translate(44 -4)"><ellipse rx="18" ry="3.5"><animateTransform attributeName="transform" type="scale" values="0.15 1;1 1;0.15 1" dur="0.18s" repeatCount="indefinite"/></ellipse></g>
        <circle cy="12" r="4" fill="#0a0c12"/>
        <path d="M0 16L-30 78M0 16L30 78" stroke-opacity=".25" stroke-dasharray="4 6">
          <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- titles -->
    <text x="430" y="132" class="title glow">NDRF BASE STATION</text>
    <text x="432" y="170" class="sub">AI-POWERED DISASTER RESPONSE COMMAND CENTER</text>
    <rect x="432" y="186" width="0" height="2" fill="#2ecc71">
      <animate attributeName="width" values="0;520;520" keyTimes="0;.3;1" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- typing terminal -->
    <text x="404" y="238" class="mono" fill="#2ecc71" style="fill:#2ecc71">&gt;</text>
    <g opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.25;1" calcMode="discrete" dur="14s" begin="0s" repeatCount="indefinite"/>
      <text x="430" y="238" class="mono" textLength="483" lengthAdjust="spacingAndGlyphs" clip-path="url(#t1)">live drone feed · COCO-SSD human detection</text>
      <rect y="221" width="11" height="22" fill="#2ecc71" x="432"><animate attributeName="x" values="432;915;915;432;432" keyTimes="0;.1;.2;.24;1" dur="14s" begin="0s" repeatCount="indefinite"/></rect></g>
    <g opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.25;1" calcMode="discrete" dur="14s" begin="3.5s" repeatCount="indefinite"/>
      <text x="430" y="238" class="mono" textLength="472" lengthAdjust="spacingAndGlyphs" clip-path="url(#t2)">gemini vision → tactical rescue briefings</text>
      <rect y="221" width="11" height="22" fill="#2ecc71" x="432"><animate attributeName="x" values="432;904;904;432;432" keyTimes="0;.1;.2;.24;1" dur="14s" begin="3.5s" repeatCount="indefinite"/></rect></g>
    <g opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.25;1" calcMode="discrete" dur="14s" begin="7s" repeatCount="indefinite"/>
      <text x="430" y="238" class="mono" textLength="368" lengthAdjust="spacingAndGlyphs" clip-path="url(#t3)">&quot;hey fateh, weather in dehradun&quot;</text>
      <rect y="221" width="11" height="22" fill="#2ecc71" x="432"><animate attributeName="x" values="432;800;800;432;432" keyTimes="0;.1;.2;.24;1" dur="14s" begin="7s" repeatCount="indefinite"/></rect></g>
    <g opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.25;1" calcMode="discrete" dur="14s" begin="10.5s" repeatCount="indefinite"/>
      <text x="430" y="238" class="mono" textLength="494" lengthAdjust="spacingAndGlyphs" clip-path="url(#t4)">shortest rescue route · weather risk engine</text>
      <rect y="221" width="11" height="22" fill="#2ecc71" x="432"><animate attributeName="x" values="432;926;926;432;432" keyTimes="0;.1;.2;.24;1" dur="14s" begin="10.5s" repeatCount="indefinite"/></rect></g>

    <!-- status chips -->
    <g transform="translate(432 288)">
      <rect width="96" height="30" rx="15" fill="#2ecc71" fill-opacity=".08" stroke="#2ecc71" stroke-opacity=".5"/>
      <circle cx="20" cy="15" r="4.5" fill="#2ecc71" class="dot"/><text x="34" y="20" class="chip">CAM</text>
      <g transform="translate(110 0)"><rect width="84" height="30" rx="15" fill="#3b82f6" fill-opacity=".08" stroke="#3b82f6" stroke-opacity=".5"/>
        <circle cx="20" cy="15" r="4.5" fill="#3b82f6" class="dot d2"/><text x="34" y="20" class="chip">AI</text></g>
      <g transform="translate(208 0)"><rect width="96" height="30" rx="15" fill="#f39c12" fill-opacity=".08" stroke="#f39c12" stroke-opacity=".5"/>
        <circle cx="20" cy="15" r="4.5" fill="#f39c12" class="dot d3"/><text x="34" y="20" class="chip">DET</text></g>
      <g transform="translate(318 0)"><rect width="116" height="30" rx="15" fill="#2ecc71" fill-opacity=".08" stroke="#2ecc71" stroke-opacity=".5"/>
        <circle cx="20" cy="15" r="4.5" fill="#2ecc71" class="dot d4"/><text x="34" y="20" class="chip">VOICE</text></g>
      <g transform="translate(448 0)"><rect width="150" height="30" rx="15" fill="#dc2626" fill-opacity=".08" stroke="#dc2626" stroke-opacity=".5"/>
        <circle cx="20" cy="15" r="4.5" fill="#dc2626" class="dot"/><text x="34" y="20" class="chip">ROUTE · OPS</text></g>
    </g>

    <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#2ecc71" stroke-opacity=".35"/>
  </g>
</svg>

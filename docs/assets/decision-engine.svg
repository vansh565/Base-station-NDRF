    .c{font:600 13px Consolas,'Courier New',monospace;fill:#c8d1e6}
    .big{font:800 22px Consolas,'Courier New',monospace;fill:#e8f5ee}
    .flow{stroke:#2ecc71;stroke-width:2;fill:none;stroke-dasharray:8 6;animation:flow .9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .ring{animation:ring .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 10%}
    @keyframes ring{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  </style></defs>

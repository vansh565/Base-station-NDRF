<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Weather risk decision engine: Open-Meteo readings evaluated against rain, wind and temperature thresholds">
  <defs><style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .h{font-size:13px;font-weight:800;letter-spacing:3px}

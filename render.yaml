# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ndrf-base-station
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 1 --threads 16 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
